name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall chạy prisma generate — cần DATABASE_URL/DIRECT_URL giả để validate schema
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          DIRECT_URL: postgresql://user:pass@localhost:5432/ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          DIRECT_URL: postgresql://user:pass@localhost:5432/ci
        # Xóa incremental cache — nếu giữ tsbuildinfo cũ thì Nest chỉ emit .d.ts, thiếu main.js
        run: |
          rm -rf dist tsconfig.build.tsbuildinfo
          npm run build

      - name: Check dist outputs
        run: |
          test -f dist/main.js
          echo "Build OK — dist/main.js present"
